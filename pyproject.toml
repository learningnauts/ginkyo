[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ginkyo"
version = "0.1.0"
description = "Vibration and sound analysis workbench (unofficial; not affiliated with HBK/LAN-XI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "PySide6-Essentials>=6.5",
  "pyqtgraph>=0.13",
  "pyuff>=2.0",
]

[project.scripts]
ginkyo = "ginkyo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
